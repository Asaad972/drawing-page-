<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doodle Deadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceaf2;
    --surface: #ffffff;
    --surface-2: #f0eef6;
    --ink: #1e1b29;
    --ink-soft: #5b5670;
    --line: #dcd8e6;
    --accent: #5a4fcf;
    --accent-ink: #ffffff;
    --urgent: #e8532e;
    --urgent-ink: #ffffff;
    --paper: #fbfaf6;
    --shadow: rgba(30, 27, 41, 0.18);
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131119;
      --surface: #211e2c;
      --surface-2: #2a2638;
      --ink: #efeaf7;
      --ink-soft: #b4adc7;
      --line: #39344c;
      --accent: #9b8fff;
      --accent-ink: #16141f;
      --urgent: #ff8a63;
      --urgent-ink: #1c1015;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131119;
    --surface: #211e2c;
    --surface-2: #2a2638;
    --ink: #efeaf7;
    --ink-soft: #b4adc7;
    --line: #39344c;
    --accent: #9b8fff;
    --accent-ink: #16141f;
    --urgent: #ff8a63;
    --urgent-ink: #1c1015;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: crosshair;
  }
  #stage.pan { cursor: grab; }
  #stage.pan:active { cursor: grabbing; }

  #board {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    background: var(--paper);
    box-shadow: 0 10px 50px var(--shadow);
    border-radius: 2px;
  }

  .hud { position: absolute; z-index: 5; transition: opacity 0.2s ease; }
  .hud.gone { opacity: 0; pointer-events: none; }

  #timer {
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 19px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  #timer.urgent {
    background: var(--urgent);
    color: var(--urgent-ink);
    border-color: var(--urgent);
    animation: pulse 1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { #timer.urgent { animation: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  #topRight {
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    display: flex;
    gap: 8px;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 9px 13px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 4px 18px var(--shadow);
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  #dock {
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: max-content;
    max-width: min(560px, calc(100vw - 16px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px;
    box-shadow: 0 10px 40px var(--shadow);
  }
  .grp {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .brk { flex-basis: 100%; height: 0; }
  @media (min-width: 620px) { .brk { display: none; } }

  .swatch {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--line);
    padding: 0;
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink);
  }
  .swatch.eraser { background: var(--paper) !important; display: grid; place-items: center; font-size: 14px; }

  .pill {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    font-size: 15px;
  }
  .pill[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .pill .dot { background: var(--ink); border-radius: 50%; display: block; }
  .icL { width: 16px; height: 2px; background: var(--ink); border-radius: 1px; transform: rotate(-28deg); display: block; }
  .icR { width: 15px; height: 11px; border: 2px solid var(--ink); border-radius: 2px; display: block; }
  .icC { width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 50%; display: block; }

  .txt-btn {
    flex: 0 0 auto;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    background: transparent;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .txt-btn.danger { color: var(--urgent); border-color: var(--urgent); }

  @media (min-width: 760px) {
    .swatch { width: 26px; height: 26px; }
    .pill { width: 30px; height: 30px; }
  }

  #showUi {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    left: 50%;
    transform: translateX(-50%);
    display: none;
  }
  body.ui-hidden #showUi { display: block; }

  #exp {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: calc(env(safe-area-inset-top) + 20px) 18px 20px;
    overflow: auto;
    align-items: center;
  }
  #exp.on { display: flex; }
  #exp img { max-width: min(560px, 100%); border-radius: 12px; border: 1px solid var(--line); }
  #exp .tip {
    max-width: 560px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 13.5px;
    line-height: 1.5;
  }

  button:focus-visible, .swatch:focus-visible, .pill:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="board" aria-label="Drawing canvas"></canvas></div>

  <div class="hud" id="timer" role="timer" aria-live="polite">2:30</div>

  <div class="hud" id="topRight">
    <button class="btn" id="fitBtn" type="button">&#10530; Fit</button>
    <button class="btn" id="hideBtn" type="button">Hide UI</button>
    <button class="btn primary" id="doneBtn" type="button">Done &#10003;</button>
  </div>

  <div class="hud" id="dock">
    <div class="grp" id="tools" role="group" aria-label="Tool"></div>
    <div class="grp" id="sizes" role="group" aria-label="Brush size"></div>
    <div class="brk"></div>
    <div class="grp" id="swatches" role="group" aria-label="Colour"></div>
    <div class="brk"></div>
    <div class="grp" role="group" aria-label="Actions">
      <button class="txt-btn" id="undoBtn" type="button">Undo</button>
      <button class="txt-btn" id="redoBtn" type="button">Redo</button>
      <button class="txt-btn" id="clearBtn" type="button">Clear</button>
    </div>
  </div>

  <button class="btn hud" id="showUi" type="button">Show tools</button>

  <div id="exp">
    <img id="expImg" alt="Your drawing">
    <div class="tip">&#128241; <b>Long-press the image and choose Save Image</b>, then upload it to the bot in your DM. (Or use <b>Hide UI</b> on the canvas and take a normal screenshot.)</div>
    <button class="btn" id="backBtn" type="button">&#8592; Back to drawing</button>
  </div>

  <script>
  (function () {
    "use strict";

    // ---- timer -----------------------------------------------------
    var qs = new URLSearchParams(location.search);
    var total = parseInt(qs.get("t"), 10);
    if (!total || total <= 0) total = 150;
    var deadline = Date.now() + total * 1000;
    var timerEl = document.getElementById("timer");
    function tick() {
      var r = Math.max(0, Math.round((deadline - Date.now()) / 1000));
      timerEl.textContent = r <= 0 ? "Time's up" : Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0");
      timerEl.classList.toggle("urgent", r <= 30);
      if (r <= 0) clearInterval(th);
    }
    tick();
    var th = setInterval(tick, 250);

    // ---- canvas --------------------------------------------------
    var CW = 1600, CH = 1200;
    var stage = document.getElementById("stage");
    var canvas = document.getElementById("board");
    canvas.width = CW; canvas.height = CH;
    canvas.style.width = CW + "px"; canvas.style.height = CH + "px";
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    function paintBg() { ctx.fillStyle = "#fbfaf6"; ctx.fillRect(0, 0, CW, CH); }
    paintBg();

    // ---- pan / zoom -------------------------------------------
    var stageRect = stage.getBoundingClientRect();
    var view = { x: 0, y: 0, scale: 1 };
    function applyView() {
      canvas.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function fitView() {
      stageRect = stage.getBoundingClientRect();
      var s = clamp(Math.min(stageRect.width / CW, stageRect.height / CH) * 0.92, 0.05, 4);
      view.scale = s;
      view.x = (stageRect.width - CW * s) / 2;
      view.y = (stageRect.height - CH * s) / 2;
      applyView();
    }
    function coverView() {
      // fill the screen with paper (like an infinite canvas); overflow is pannable
      stageRect = stage.getBoundingClientRect();
      var s = clamp(Math.max(stageRect.width / CW, stageRect.height / CH), 0.08, 8);
      view.scale = s;
      view.x = (stageRect.width - CW * s) / 2;
      view.y = (stageRect.height - CH * s) / 2;
      applyView();
    }
    function zoomAt(clientX, clientY, k) {
      var sx = clientX - stageRect.left, sy = clientY - stageRect.top;
      var ns = clamp(view.scale * k, 0.08, 8);
      var eff = ns / view.scale;
      view.x = sx - (sx - view.x) * eff;
      view.y = sy - (sy - view.y) * eff;
      view.scale = ns;
    }
    coverView();
    window.addEventListener("resize", function () {
      stageRect = stage.getBoundingClientRect();
      applyView();
    });
    stage.addEventListener("wheel", function (e) {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012));
      applyView();
    }, { passive: false });
    stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    function toCanvas(clientX, clientY) {
      return {
        x: (clientX - stageRect.left - view.x) / view.scale,
        y: (clientY - stageRect.top - view.y) / view.scale
      };
    }

    // ---- history (PNG data URLs keep memory tiny) -----------
    var history = [], redo = [], HMAX = 14;
    function pushHist() {
      history.push(canvas.toDataURL("image/png"));
      if (history.length > HMAX) history.shift();
    }
    function commit() { pushHist(); redo.length = 0; }
    function restore(url) {
      var img = new Image();
      img.onload = function () { ctx.clearRect(0, 0, CW, CH); ctx.drawImage(img, 0, 0, CW, CH); };
      img.src = url;
    }
    function undo() {
      if (history.length <= 1) return;
      redo.push(history.pop());
      if (redo.length > HMAX) redo.shift();
      restore(history[history.length - 1]);
    }
    function redoFn() {
      if (!redo.length) return;
      var u = redo.pop();
      history.push(u);
      if (history.length > HMAX) history.shift();
      restore(u);
    }
    function clearBoard() { paintBg(); commit(); }
    pushHist();

    // ---- palette / tools ----------------------------------
    var COLORS = [
      ["Ink", "#17141d"], ["Grey", "#8b859c"], ["Red", "#e8532e"], ["Orange", "#f08a3c"],
      ["Gold", "#e8a63d"], ["Green", "#2e9e6b"], ["Teal", "#2ea7a0"], ["Blue", "#3d7fe0"],
      ["Indigo", "#5a4fcf"], ["Purple", "#9457d1"], ["Pink", "#e0609f"], ["Brown", "#8a5a3c"]
    ];
    var SIZES = [2, 5, 10, 20];
    var st = { color: COLORS[0][1], size: SIZES[1], erasing: false };
    var tool = "pen";

    function setPressed(list, active) {
      list.forEach(function (el) { el.setAttribute("aria-pressed", el === active ? "true" : "false"); });
    }

    var swWrap = document.getElementById("swatches"), swEls = [];
    COLORS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "swatch"; b.style.background = c[1];
      b.setAttribute("aria-label", c[0]);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function () {
        st.color = c[1]; st.erasing = false; setPressed(swEls.concat([erB]), b);
      });
      swWrap.appendChild(b); swEls.push(b);
    });
    var erB = document.createElement("button");
    erB.type = "button"; erB.className = "swatch eraser"; erB.textContent = "🧽";
    erB.setAttribute("aria-label", "Eraser"); erB.setAttribute("aria-pressed", "false");
    erB.addEventListener("click", function () { st.erasing = true; setPressed(swEls.concat([erB]), erB); });
    swWrap.appendChild(erB);

    var szWrap = document.getElementById("sizes"), szEls = [];
    SIZES.forEach(function (sz, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-label", "Brush size " + (i + 1));
      b.setAttribute("aria-pressed", i === 1 ? "true" : "false");
      var d = document.createElement("span");
      d.className = "dot";
      var px = 6 + i * 4;
      d.style.width = px + "px"; d.style.height = px + "px";
      b.appendChild(d);
      b.addEventListener("click", function () { st.size = sz; setPressed(szEls, b); });
      szWrap.appendChild(b); szEls.push(b);
    });

    var TOOLS = [
      ["pen", "Freehand pen", function () { var s = document.createElement("span"); s.textContent = "✏️"; return s; }],
      ["line", "Straight line", function () { var s = document.createElement("span"); s.className = "icL"; return s; }],
      ["rect", "Rectangle", function () { var s = document.createElement("span"); s.className = "icR"; return s; }],
      ["circle", "Circle", function () { var s = document.createElement("span"); s.className = "icC"; return s; }],
      ["fill", "Fill area", function () { var s = document.createElement("span"); s.textContent = "🪣"; return s; }],
      ["pan", "Move / pan", function () { var s = document.createElement("span"); s.textContent = "✋"; return s; }]
    ];
    var tlWrap = document.getElementById("tools"), tlEls = [];
    TOOLS.forEach(function (t, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-label", t[1]);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.appendChild(t[2]());
      b.addEventListener("click", function () {
        tool = t[0];
        setPressed(tlEls, b);
        stage.classList.toggle("pan", tool === "pan");
      });
      tlWrap.appendChild(b); tlEls.push(b);
    });

    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("redoBtn").addEventListener("click", redoFn);

    var clB = document.getElementById("clearBtn"), armed = false, armT = null;
    function disarm() {
      armed = false; clB.textContent = "Clear"; clB.classList.remove("danger");
      if (armT) { clearTimeout(armT); armT = null; }
    }
    clB.addEventListener("click", function () {
      if (!armed) {
        armed = true; clB.textContent = "Confirm?"; clB.classList.add("danger");
        armT = setTimeout(disarm, 2500);
        return;
      }
      disarm();
      clearBoard();
    });

    // ---- drawing ------------------------------------------
    var SM = 0.6;
    var drawing = false, last = null, smooth = null;
    var shapeStart = null, shapeSnap = null;

    function strokeTo(p) {
      ctx.strokeStyle = st.erasing ? "#fbfaf6" : st.color;
      ctx.lineWidth = st.erasing ? st.size * 2.4 : st.size;
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = { x: p.x, y: p.y };
    }
    function drawShape(kind, a, b) {
      ctx.strokeStyle = st.erasing ? "#fbfaf6" : st.color;
      ctx.lineWidth = st.erasing ? st.size * 2.4 : st.size;
      ctx.beginPath();
      if (kind === "line") {
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      } else if (kind === "rect") {
        ctx.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      } else if (kind === "circle") {
        var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
        var rx = Math.max(0.5, Math.abs(b.x - a.x) / 2), ry = Math.max(0.5, Math.abs(b.y - a.y) / 2);
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      }
      ctx.stroke();
    }
    function hexRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function floodFill(sx, sy) {
      sx = Math.round(sx); sy = Math.round(sy);
      if (sx < 0 || sy < 0 || sx >= CW || sy >= CH) return;
      var im = ctx.getImageData(0, 0, CW, CH), d = im.data;
      var si = (sy * CW + sx) * 4, tr = d[si], tg = d[si + 1], tb = d[si + 2];
      var f = st.erasing ? [251, 250, 246] : hexRgb(st.color);
      if (Math.abs(tr - f[0]) + Math.abs(tg - f[1]) + Math.abs(tb - f[2]) < 8) return;
      var tol = 42, seen = new Uint8Array(CW * CH), stk = [sy * CW + sx];
      while (stk.length) {
        var p = stk.pop();
        if (seen[p]) continue;
        seen[p] = 1;
        var i = p * 4;
        if (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) > tol) continue;
        d[i] = f[0]; d[i + 1] = f[1]; d[i + 2] = f[2]; d[i + 3] = 255;
        var x = p % CW, y = (p - x) / CW;
        if (x + 1 < CW) stk.push(p + 1);
        if (x - 1 >= 0) stk.push(p - 1);
        if (y + 1 < CH) stk.push(p + CW);
        if (y - 1 >= 0) stk.push(p - CW);
      }
      ctx.putImageData(im, 0, 0);
      commit();
    }

    function startDraw(cx, cy) {
      drawing = true;
      last = { x: cx, y: cy };
      if (tool === "pen") {
        smooth = { x: cx, y: cy };
        ctx.fillStyle = st.erasing ? "#fbfaf6" : st.color;
        ctx.beginPath();
        ctx.arc(cx, cy, (st.erasing ? st.size * 2.4 : st.size) / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        shapeStart = { x: cx, y: cy };
        shapeSnap = ctx.getImageData(0, 0, CW, CH);
      }
    }
    function moveDraw(cx, cy) {
      if (tool === "pen") {
        smooth.x += (cx - smooth.x) * SM;
        smooth.y += (cy - smooth.y) * SM;
        strokeTo({ x: smooth.x, y: smooth.y });
      } else if (shapeSnap) {
        ctx.putImageData(shapeSnap, 0, 0);
        drawShape(tool, shapeStart, { x: cx, y: cy });
      }
    }
    function endDraw(cx, cy, keep) {
      if (!drawing) return;
      if (tool !== "pen" && shapeSnap) {
        ctx.putImageData(shapeSnap, 0, 0);
        if (keep) { drawShape(tool, shapeStart, { x: cx, y: cy }); commit(); }
      } else {
        if (tool === "pen" && keep) strokeTo({ x: cx, y: cy });
        if (keep) commit();
      }
      drawing = false;
      shapeSnap = null;
    }
    function abortDraw() {
      if (!drawing) return;
      if (tool !== "pen" && shapeSnap) ctx.putImageData(shapeSnap, 0, 0);
      drawing = false;
      shapeSnap = null;
    }

    // ---- pointers / gestures ----------------------------
    var ptrs = new Map();
    var pinch = null;
    var panStart = null;
    var pending = null; // one finger down, not yet a stroke (so a 2nd finger = pan/zoom, not a smear)

    function midDist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }

    stage.addEventListener("pointerdown", function (e) {
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (ptrs.size === 2) {
        pending = null;
        abortDraw();
        var a = Array.from(ptrs.values());
        pinch = { d: midDist(a[0], a[1]), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
        return;
      }
      if (ptrs.size !== 1) return;

      var p = toCanvas(e.clientX, e.clientY);
      if (tool === "fill") { floodFill(p.x, p.y); return; }
      if (tool === "pan") { panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; return; }
      pending = { sx: e.clientX, sy: e.clientY, cx: p.x, cy: p.y };
    });

    stage.addEventListener("pointermove", function (e) {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pinch && ptrs.size >= 2) {
        var a = Array.from(ptrs.values());
        var nd = midDist(a[0], a[1]);
        var nmx = (a[0].x + a[1].x) / 2, nmy = (a[0].y + a[1].y) / 2;
        zoomAt(nmx, nmy, nd / (pinch.d || nd));
        view.x += nmx - pinch.mx;
        view.y += nmy - pinch.my;
        applyView();
        pinch.d = nd; pinch.mx = nmx; pinch.my = nmy;
        return;
      }
      if (panStart) {
        view.x = panStart.vx + (e.clientX - panStart.x);
        view.y = panStart.vy + (e.clientY - panStart.y);
        applyView();
        return;
      }
      if (pending) {
        if (Math.hypot(e.clientX - pending.sx, e.clientY - pending.sy) > 4) {
          startDraw(pending.cx, pending.cy);
          pending = null;
          var q = toCanvas(e.clientX, e.clientY);
          moveDraw(q.x, q.y);
        }
        return;
      }
      if (drawing) {
        var p = toCanvas(e.clientX, e.clientY);
        moveDraw(p.x, p.y);
      }
    });

    function up(e) {
      ptrs.delete(e.pointerId);
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

      if (pinch && ptrs.size < 2) pinch = null;
      if (panStart && ptrs.size === 0) panStart = null;

      if (pending && ptrs.size === 0) {
        startDraw(pending.cx, pending.cy);
        endDraw(pending.cx, pending.cy, true); // a tap = one dot
        pending = null;
        return;
      }
      if (drawing && ptrs.size === 0) {
        var p = toCanvas(e.clientX, e.clientY);
        endDraw(p.x, p.y, e.type === "pointerup");
      }
    }
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);

    // ---- HUD -------------------------------------------
    document.getElementById("fitBtn").addEventListener("click", fitView);

    var hudEls = Array.prototype.slice.call(document.querySelectorAll(".hud"));
    document.getElementById("hideBtn").addEventListener("click", function () {
      document.body.classList.add("ui-hidden");
      hudEls.forEach(function (h) { if (h.id !== "showUi") h.classList.add("gone"); });
    });
    document.getElementById("showUi").addEventListener("click", function () {
      document.body.classList.remove("ui-hidden");
      hudEls.forEach(function (h) { h.classList.remove("gone"); });
    });

    var exp = document.getElementById("exp"), expImg = document.getElementById("expImg");
    document.getElementById("doneBtn").addEventListener("click", function () {
      expImg.src = canvas.toDataURL("image/png");
      exp.classList.add("on");
    });
    document.getElementById("backBtn").addEventListener("click", function () {
      exp.classList.remove("on");
    });
  })();
  </script>
</body>
</html>
