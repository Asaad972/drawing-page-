<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doodle Deadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceaf2;
    --surface: #ffffff;
    --surface-2: #f0eef6;
    --ink: #1e1b29;
    --ink-soft: #5b5670;
    --line: #dcd8e6;
    --accent: #5a4fcf;
    --accent-ink: #ffffff;
    --urgent: #e8532e;
    --urgent-ink: #ffffff;
    --shadow: rgba(30, 27, 41, 0.18);
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131119;
      --surface: #211e2c;
      --surface-2: #2a2638;
      --ink: #efeaf7;
      --ink-soft: #b4adc7;
      --line: #39344c;
      --accent: #9b8fff;
      --accent-ink: #16141f;
      --urgent: #ff8a63;
      --urgent-ink: #1c1015;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131119;
    --surface: #211e2c;
    --surface-2: #2a2638;
    --ink: #efeaf7;
    --ink-soft: #b4adc7;
    --line: #39344c;
    --accent: #9b8fff;
    --accent-ink: #16141f;
    --urgent: #ff8a63;
    --urgent-ink: #1c1015;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    background: #fbfaf6;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    background: #fbfaf6;
    cursor: crosshair;
  }
  #stage.pan { cursor: grab; }
  #stage.pan:active { cursor: grabbing; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: absolute; z-index: 5; transition: opacity 0.2s ease; }
  .hud.gone { opacity: 0; pointer-events: none; }

  #timer {
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 19px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  #timer.urgent {
    background: var(--urgent);
    color: var(--urgent-ink);
    border-color: var(--urgent);
    animation: pulse 1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { #timer.urgent { animation: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  #topRight {
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    display: flex;
    gap: 8px;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 9px 13px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 4px 18px var(--shadow);
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  #dock {
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: max-content;
    max-width: min(560px, calc(100vw - 16px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px;
    box-shadow: 0 10px 40px var(--shadow);
  }
  .grp {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .brk { flex-basis: 100%; height: 0; }
  @media (min-width: 620px) { .brk { display: none; } }

  #swatches {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: min(520px, calc(100vw - 44px));
    padding-bottom: 2px;
    scrollbar-width: thin;
  }
  #swatches::-webkit-scrollbar { height: 5px; }
  #swatches::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  /* roomy screens: no scrolling, just wrap the whole palette into rows */
  @media (min-width: 640px) {
    #swatches {
      flex-wrap: wrap;
      overflow: visible;
      max-width: 340px;
      justify-content: center;
    }
  }

  .swatch {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--line);
    padding: 0;
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink);
  }
  .swatch.eraser { background: #fbfaf6 !important; display: grid; place-items: center; font-size: 14px; }
  .swatch.custom {
    background: conic-gradient(from 90deg, #f33, #fd0, #4d4, #2ad, #64f, #f4c, #f33);
    position: relative;
  }
  .swatch.custom input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  .pill {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    font-size: 15px;
    color: var(--ink);
  }
  .pill[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .pill .dot { background: var(--ink); border-radius: 50%; display: block; }
  .icL { width: 16px; height: 2px; background: var(--ink); border-radius: 1px; transform: rotate(-28deg); display: block; }
  .icR { width: 15px; height: 11px; border: 2px solid var(--ink); border-radius: 2px; display: block; }
  .icC { width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 50%; display: block; }

  .txt-btn {
    flex: 0 0 auto;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    background: transparent;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .txt-btn.danger { color: var(--urgent); border-color: var(--urgent); }

  #zoomPct {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 12px;
    min-width: 48px;
    text-align: center;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 4px;
    background: var(--surface-2);
    color: var(--ink);
  }

  @media (min-width: 760px) {
    .swatch { width: 26px; height: 26px; }
    .pill { width: 30px; height: 30px; }
  }

  #showUi {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    left: 50%;
    transform: translateX(-50%);
    display: none;
  }
  body.ui-hidden #showUi { display: block; }

  #exp {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: calc(env(safe-area-inset-top) + 20px) 18px 20px;
    overflow: auto;
    align-items: center;
  }
  #exp.on { display: flex; }
  #exp img { max-width: min(560px, 100%); border-radius: 12px; border: 1px solid var(--line); background: #fbfaf6; }
  #exp .tip {
    max-width: 560px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 13.5px;
    line-height: 1.5;
  }

  button:focus-visible, .swatch:focus-visible, .pill:focus-visible, #zoomPct:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- custom colour picker ---- */
  #cpick {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(12, 12, 18, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #cpick[hidden] { display: none !important; }
  .cp-card {
    width: min(320px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 60px var(--shadow);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cp-sat {
    position: relative;
    width: 100%;
    height: 168px;
    border-radius: 12px;
    touch-action: none;
    cursor: crosshair;
    overflow: hidden;
  }
  .cp-hue {
    position: relative;
    width: 100%;
    height: 22px;
    border-radius: 999px;
    touch-action: none;
    cursor: pointer;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .cp-knob {
    position: absolute;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 1px 4px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }
  .cp-hknob {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }
  .cp-row { display: flex; align-items: center; gap: 8px; }
  .cp-prev {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--line);
  }
  .cp-hex {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 15px;
    text-transform: uppercase;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .cp-btn {
    flex: 0 0 auto;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 12px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .cp-btn.cp-done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>
  <div id="stage"><canvas id="board" aria-label="Drawing canvas"></canvas></div>

  <div class="hud" id="timer" role="timer" aria-live="polite">2:30</div>

  <div class="hud" id="topRight">
    <button class="btn" id="fitBtn" type="button">&#10530; Fit</button>
    <button class="btn" id="hideBtn" type="button">Hide UI</button>
    <button class="btn primary" id="doneBtn" type="button">Done &#10003;</button>
  </div>

  <div class="hud" id="dock">
    <div class="grp" id="tools" role="group" aria-label="Tool"></div>
    <div class="grp" id="sizes" role="group" aria-label="Brush size"></div>
    <div class="grp" role="group" aria-label="Zoom">
      <button class="pill" id="zoomOut" type="button" aria-label="Zoom out">&#8722;</button>
      <button id="zoomPct" type="button" aria-label="Reset zoom to 100%">100%</button>
      <button class="pill" id="zoomIn" type="button" aria-label="Zoom in">&#43;</button>
    </div>
    <div class="brk"></div>
    <div class="grp" id="swatches" role="group" aria-label="Colour"></div>
    <div class="brk"></div>
    <div class="grp" role="group" aria-label="Actions">
      <button class="txt-btn" id="undoBtn" type="button">Undo</button>
      <button class="txt-btn" id="redoBtn" type="button">Redo</button>
      <button class="txt-btn" id="clearBtn" type="button">Clear</button>
    </div>
  </div>

  <button class="btn hud" id="showUi" type="button">Show tools</button>

  <div id="exp">
    <img id="expImg" alt="Your drawing">
    <div class="tip">&#128241; <b>Long-press the image and choose Save Image</b>, then upload it to the bot in your DM. (Or use <b>Hide UI</b> on the canvas and take a normal screenshot.)</div>
    <button class="btn" id="backBtn" type="button">&#8592; Back to drawing</button>
  </div>

  <div id="cpick" hidden>
    <div class="cp-card" role="dialog" aria-label="Pick a colour">
      <div class="cp-sat" id="cpSat"><span class="cp-knob" id="cpSatKnob"></span></div>
      <div class="cp-hue" id="cpHue"><span class="cp-hknob" id="cpHueKnob"></span></div>
      <div class="cp-row">
        <span class="cp-prev" id="cpPrev"></span>
        <input class="cp-hex" id="cpHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour">
        <button class="cp-btn" id="cpEye" type="button" hidden aria-label="Pick from screen">&#9673;</button>
        <button class="cp-btn cp-done" id="cpDone" type="button">Done</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    var PAPER = "#fbfaf6";
    var GRID = "rgba(30,27,41,0.10)";

    // ---- timer -----------------------------------------------------
    var qs = new URLSearchParams(location.search);
    var total = parseInt(qs.get("t"), 10);
    if (!total || total <= 0) total = 150;
    var deadline = Date.now() + total * 1000;
    var timerEl = document.getElementById("timer");
    function tickTimer() {
      var r = Math.max(0, Math.round((deadline - Date.now()) / 1000));
      timerEl.textContent = r <= 0 ? "Time's up" : Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0");
      timerEl.classList.toggle("urgent", r <= 30);
      if (r <= 0) clearInterval(th);
    }
    tickTimer();
    var th = setInterval(tickTimer, 250);

    // ---- canvas + infinite view ---------------------------------
    var stage = document.getElementById("stage");
    var canvas = document.getElementById("board");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var rect = stage.getBoundingClientRect();
    // view maps world -> screen:  screen = world * scale + {x,y}
    var view = { x: rect.width / 2, y: rect.height / 2, scale: 1 };

    function sizeCanvas() {
      rect = stage.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function toWorld(clientX, clientY) {
      return {
        x: (clientX - rect.left - view.x) / view.scale,
        y: (clientY - rect.top - view.y) / view.scale
      };
    }
    function zoomAtPoint(px, py, k) {
      var ns = clamp(view.scale * k, 0.1, 30);
      var eff = ns / view.scale;
      view.x = px - (px - view.x) * eff;
      view.y = py - (py - view.y) * eff;
      view.scale = ns;
    }
    var zoomPctEl = document.getElementById("zoomPct");
    function updateZoom() { zoomPctEl.textContent = Math.round(view.scale * 100) + "%"; }

    // ---- scene (vector elements, world coordinates) ------------
    // stroke: {type:'stroke', color, size, pts:[{x,y}...]}
    // shape : {type:'shape', kind:'line'|'rect'|'circle', color, size, a:{x,y}, b:{x,y}}
    // image : {type:'image', src, x, y, w, h, img}   (used by the fill bucket)
    var scene = [];
    var live = null;
    var acts = [], undone = [], ACTS_MAX = 80;

    function pushAdd(el) {
      scene.push(el);
      acts.push({ t: "add", el: el });
      if (acts.length > ACTS_MAX) acts.shift();
      undone.length = 0;
      render();
    }
    function doClear() {
      if (!scene.length) return;
      acts.push({ t: "clear", els: scene.slice() });
      if (acts.length > ACTS_MAX) acts.shift();
      scene.length = 0;
      undone.length = 0;
      render();
    }
    function undo() {
      var a = acts.pop();
      if (!a) return;
      if (a.t === "add") scene.pop();
      else scene = a.els.slice();
      undone.push(a);
      render();
    }
    function redoFn() {
      var a = undone.pop();
      if (!a) return;
      if (a.t === "add") scene.push(a.el);
      else scene.length = 0;
      acts.push(a);
      render();
    }

    function hexRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    // ---- rendering -------------------------------------------
    function drawEl(c, el) {
      if (el.type === "stroke") {
        var p = el.pts;
        if (!p.length) return;
        c.strokeStyle = el.color;
        c.fillStyle = el.color;
        c.lineWidth = el.size;
        c.lineCap = "round";
        c.lineJoin = "round";
        if (p.length === 1) {
          c.beginPath();
          c.arc(p[0].x, p[0].y, Math.max(0.1, el.size / 2), 0, 6.2832);
          c.fill();
          return;
        }
        c.beginPath();
        c.moveTo(p[0].x, p[0].y);
        for (var i = 1; i < p.length - 1; i++) {
          var mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2;
          c.quadraticCurveTo(p[i].x, p[i].y, mx, my);
        }
        c.lineTo(p[p.length - 1].x, p[p.length - 1].y);
        c.stroke();
      } else if (el.type === "shape") {
        c.strokeStyle = el.color;
        c.lineWidth = el.size;
        c.lineCap = "round";
        c.lineJoin = "round";
        c.beginPath();
        if (el.kind === "line") {
          c.moveTo(el.a.x, el.a.y);
          c.lineTo(el.b.x, el.b.y);
        } else if (el.kind === "rect") {
          c.rect(Math.min(el.a.x, el.b.x), Math.min(el.a.y, el.b.y),
                 Math.abs(el.b.x - el.a.x), Math.abs(el.b.y - el.a.y));
        } else {
          var cx = (el.a.x + el.b.x) / 2, cy = (el.a.y + el.b.y) / 2;
          c.ellipse(cx, cy, Math.max(0.1, Math.abs(el.b.x - el.a.x) / 2),
                    Math.max(0.1, Math.abs(el.b.y - el.a.y) / 2), 0, 0, 6.2832);
        }
        c.stroke();
      } else if (el.type === "image" && el.img && el.img.complete && el.img.naturalWidth) {
        c.drawImage(el.img, el.x, el.y, el.w, el.h);
      }
    }

    function drawGrid() {
      var g = 42 * view.scale;
      if (g < 9) return; // too dense when far out, skip
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = GRID;
      var ox = ((view.x % g) + g) % g;
      var oy = ((view.y % g) + g) % g;
      var r = view.scale >= 1 ? 1.2 : 1;
      for (var x = ox; x < rect.width; x += g) {
        for (var y = oy; y < rect.height; y += g) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, 6.2832);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    var rafPending = false;
    function render() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(paint);
    }
    function paint() {
      rafPending = false;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = PAPER;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      for (var i = 0; i < scene.length; i++) drawEl(ctx, scene[i]);
      if (live) drawEl(ctx, live);
    }
    function applyRender() { render(); updateZoom(); }

    sizeCanvas();
    updateZoom();
    render();

    window.addEventListener("resize", function () {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      sizeCanvas();
      render();
    });

    // ---- content bounds / fit / export -----------------------
    function contentBounds() {
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, any = false;
      function ext(x, y) { any = true; if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
      scene.forEach(function (el) {
        if (el.type === "stroke") {
          el.pts.forEach(function (p) { ext(p.x - el.size, p.y - el.size); ext(p.x + el.size, p.y + el.size); });
        } else if (el.type === "shape") {
          ext(Math.min(el.a.x, el.b.x) - el.size, Math.min(el.a.y, el.b.y) - el.size);
          ext(Math.max(el.a.x, el.b.x) + el.size, Math.max(el.a.y, el.b.y) + el.size);
        } else if (el.type === "image") {
          ext(el.x, el.y); ext(el.x + el.w, el.y + el.h);
        }
      });
      return any ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY } : null;
    }
    function fitContent() {
      rect = stage.getBoundingClientRect();
      var b = contentBounds();
      if (!b) {
        view.scale = 1;
        view.x = rect.width / 2;
        view.y = rect.height / 2;
        applyRender();
        return;
      }
      var pad = 64;
      var s = clamp(Math.min(rect.width / (b.w + pad * 2), rect.height / (b.h + pad * 2)), 0.1, 4);
      view.scale = s;
      view.x = rect.width / 2 - (b.x + b.w / 2) * s;
      view.y = rect.height / 2 - (b.y + b.h / 2) * s;
      applyRender();
    }
    function exportPNG() {
      var b = contentBounds();
      var out = document.createElement("canvas");
      var oc;
      if (b) {
        var pad = 44;
        var scaleOut = clamp(1700 / (b.w + pad * 2), 1, 3);
        out.width = Math.max(1, Math.round((b.w + pad * 2) * scaleOut));
        out.height = Math.max(1, Math.round((b.h + pad * 2) * scaleOut));
        oc = out.getContext("2d");
        oc.fillStyle = PAPER;
        oc.fillRect(0, 0, out.width, out.height);
        oc.scale(scaleOut, scaleOut);
        oc.translate(pad - b.x, pad - b.y);
        scene.forEach(function (el) { drawEl(oc, el); });
      } else {
        out.width = Math.max(1, Math.round(rect.width));
        out.height = Math.max(1, Math.round(rect.height));
        oc = out.getContext("2d");
        oc.fillStyle = PAPER;
        oc.fillRect(0, 0, out.width, out.height);
      }
      return out.toDataURL("image/png");
    }

    // ---- palette / tools ----------------------------------
    var COLORS = [
      ["Black", "#000000"], ["Ink", "#17141d"], ["Charcoal", "#3a3a44"], ["Grey", "#8b859c"],
      ["Silver", "#c9c6d4"], ["White", "#ffffff"],
      ["Maroon", "#7a1420"], ["Crimson", "#c81e2e"], ["Red", "#e8352b"], ["Coral", "#ff6f5e"],
      ["Orange", "#f08a3c"], ["Amber", "#f5a623"], ["Gold", "#e8b93d"], ["Yellow", "#f5df3d"],
      ["Lime", "#9ccb3b"], ["Green", "#3aa657"], ["Emerald", "#1f8a5f"], ["Teal", "#2ea7a0"],
      ["Sky", "#4aa8e0"], ["Blue", "#3d7fe0"], ["Navy", "#26306e"], ["Indigo", "#5a4fcf"],
      ["Purple", "#9457d1"], ["Magenta", "#c93fb0"], ["Pink", "#e0609f"], ["Rose", "#ff9ec7"],
      ["Brown", "#8a5a3c"], ["Tan", "#c99a6a"]
    ];
    var SIZES = [2, 5, 10, 20];
    var st = { color: COLORS[0][1], size: SIZES[1], erasing: false };
    var tool = "pen";

    function setPressed(list, active) {
      list.forEach(function (el) { el.setAttribute("aria-pressed", el === active ? "true" : "false"); });
    }

    var swWrap = document.getElementById("swatches"), swEls = [];
    COLORS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "swatch"; b.style.background = c[1];
      b.setAttribute("aria-label", c[0]);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", function () {
        st.color = c[1]; st.erasing = false; setPressed(swEls.concat([customB, erB]), b);
      });
      swWrap.appendChild(b); swEls.push(b);
    });

    // "any colour" — opens the built-in picker (same on phone and PC)
    var customB = document.createElement("button");
    customB.type = "button";
    customB.className = "swatch custom";
    customB.setAttribute("aria-label", "Custom colour");
    customB.setAttribute("aria-pressed", "false");
    var customHex = "#e8352b";
    function useCustom(hex) {
      customHex = hex;
      st.color = hex;
      st.erasing = false;
      customB.style.background = hex;
      setPressed(swEls.concat([customB, erB]), customB);
    }
    customB.addEventListener("click", function () { openPicker(st.erasing ? customHex : (st.color || customHex)); });
    swWrap.appendChild(customB); swEls.push(customB);

    var erB = document.createElement("button");
    erB.type = "button"; erB.className = "swatch eraser"; erB.textContent = "🧽";
    erB.setAttribute("aria-label", "Eraser"); erB.setAttribute("aria-pressed", "false");
    erB.addEventListener("click", function () { st.erasing = true; setPressed(swEls.concat([erB]), erB); });
    swWrap.appendChild(erB);

    // mouse wheel scrolls the palette sideways when it's a strip (no visible bar needed)
    swWrap.addEventListener("wheel", function (e) {
      if (swWrap.scrollWidth <= swWrap.clientWidth) return;
      e.preventDefault();
      swWrap.scrollLeft += (e.deltaY || e.deltaX);
    }, { passive: false });

    // ---- built-in colour picker (saturation square + hue bar + hex) --------
    var cp = document.getElementById("cpick");
    var cpSat = document.getElementById("cpSat"), cpSatKnob = document.getElementById("cpSatKnob");
    var cpHue = document.getElementById("cpHue"), cpHueKnob = document.getElementById("cpHueKnob");
    var cpPrev = document.getElementById("cpPrev"), cpHex = document.getElementById("cpHex");
    var cpEye = document.getElementById("cpEye"), cpDone = document.getElementById("cpDone");
    var hsv = { h: 0, s: 1, v: 1 };

    function hsv2rgb(h, s, v) {
      h = ((h % 360) + 360) % 360 / 60;
      var c = v * s, x = c * (1 - Math.abs((h % 2) - 1)), m = v - c;
      var r = [c, x, 0, 0, x, c][Math.floor(h)] + m;
      var g = [x, c, c, x, 0, 0][Math.floor(h)] + m;
      var b = [0, 0, x, c, c, x][Math.floor(h)] + m;
      return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
    }
    function rgb2hsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
      if (d) {
        if (mx === r) h = ((g - b) / d) % 6;
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return { h: (h + 360) % 360, s: mx ? d / mx : 0, v: mx };
    }
    function hex2rgb(h) {
      h = h.replace("#", "");
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function rgb2hex(r, g, b) {
      return "#" + [r, g, b].map(function (n) { return ("0" + n.toString(16)).slice(-2); }).join("");
    }

    function cpRender(commit) {
      var pure = "hsl(" + hsv.h + ",100%,50%)";
      cpSat.style.background =
        "linear-gradient(to top, #000, transparent)," +
        "linear-gradient(to right, #fff, transparent)," + pure;
      var sr = cpSat.getBoundingClientRect();
      cpSatKnob.style.left = (hsv.s * sr.width) + "px";
      cpSatKnob.style.top = ((1 - hsv.v) * sr.height) + "px";
      cpHueKnob.style.left = (hsv.h / 360 * cpHue.getBoundingClientRect().width) + "px";
      var rgb = hsv2rgb(hsv.h, hsv.s, hsv.v);
      var hex = rgb2hex(rgb[0], rgb[1], rgb[2]);
      cpPrev.style.background = hex;
      if (document.activeElement !== cpHex) cpHex.value = hex.toUpperCase();
      if (commit !== false) useCustom(hex);
    }

    function dragArea(el, onMove) {
      var active = false;
      function pos(e) {
        var r = el.getBoundingClientRect();
        onMove(clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1));
      }
      el.addEventListener("pointerdown", function (e) {
        active = true;
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        pos(e);
      });
      el.addEventListener("pointermove", function (e) { if (active) pos(e); });
      el.addEventListener("pointerup", function () { active = false; });
      el.addEventListener("pointercancel", function () { active = false; });
    }
    dragArea(cpSat, function (x, y) { hsv.s = x; hsv.v = 1 - y; cpRender(); });
    dragArea(cpHue, function (x) { hsv.h = x * 360; cpRender(); });

    cpHex.addEventListener("input", function () {
      var v = cpHex.value.trim();
      if (v && v[0] !== "#") v = "#" + v;
      var rgb = hex2rgb(v);
      if (rgb) { hsv = rgb2hsv(rgb[0], rgb[1], rgb[2]); cpRender(); }
    });

    if (window.EyeDropper) {
      cpEye.hidden = false;
      cpEye.addEventListener("click", function () {
        new window.EyeDropper().open().then(function (r) {
          var rgb = hex2rgb(r.sRGBHex);
          if (rgb) { hsv = rgb2hsv(rgb[0], rgb[1], rgb[2]); cpRender(); }
        }).catch(function () {});
      });
    }

    function closePicker() { cp.hidden = true; }
    cpDone.addEventListener("click", closePicker);
    cp.addEventListener("pointerdown", function (e) { if (e.target === cp) closePicker(); });

    function openPicker(startHex) {
      var rgb = hex2rgb(startHex || customHex) || [232, 53, 43];
      hsv = rgb2hsv(rgb[0], rgb[1], rgb[2]);
      cp.hidden = false;
      requestAnimationFrame(function () { cpRender(false); useCustom(rgb2hex(rgb[0], rgb[1], rgb[2])); });
    }

    var szWrap = document.getElementById("sizes"), szEls = [];
    SIZES.forEach(function (sz, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-label", "Brush size " + (i + 1));
      b.setAttribute("aria-pressed", i === 1 ? "true" : "false");
      var d = document.createElement("span");
      d.className = "dot";
      var px = 6 + i * 4;
      d.style.width = px + "px"; d.style.height = px + "px";
      b.appendChild(d);
      b.addEventListener("click", function () { st.size = sz; setPressed(szEls, b); });
      szWrap.appendChild(b); szEls.push(b);
    });

    var TOOLS = [
      ["pen", "Freehand pen", function () { var s = document.createElement("span"); s.textContent = "✏️"; return s; }],
      ["line", "Straight line", function () { var s = document.createElement("span"); s.className = "icL"; return s; }],
      ["rect", "Rectangle", function () { var s = document.createElement("span"); s.className = "icR"; return s; }],
      ["circle", "Circle", function () { var s = document.createElement("span"); s.className = "icC"; return s; }],
      ["fill", "Fill area", function () { var s = document.createElement("span"); s.textContent = "🪣"; return s; }],
      ["pan", "Move / pan", function () { var s = document.createElement("span"); s.textContent = "✋"; return s; }]
    ];
    var tlWrap = document.getElementById("tools"), tlEls = [];
    TOOLS.forEach(function (t, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "pill";
      b.setAttribute("aria-label", t[1]);
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.appendChild(t[2]());
      b.addEventListener("click", function () {
        tool = t[0];
        setPressed(tlEls, b);
        stage.classList.toggle("pan", tool === "pan");
      });
      tlWrap.appendChild(b); tlEls.push(b);
    });

    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("redoBtn").addEventListener("click", redoFn);
    document.getElementById("zoomIn").addEventListener("click", function () { zoomAtPoint(rect.width / 2, rect.height / 2, 1.25); applyRender(); });
    document.getElementById("zoomOut").addEventListener("click", function () { zoomAtPoint(rect.width / 2, rect.height / 2, 0.8); applyRender(); });
    zoomPctEl.addEventListener("click", function () { zoomAtPoint(rect.width / 2, rect.height / 2, 1 / view.scale); applyRender(); });

    var clB = document.getElementById("clearBtn"), armed = false, armT = null;
    function disarm() {
      armed = false; clB.textContent = "Clear"; clB.classList.remove("danger");
      if (armT) { clearTimeout(armT); armT = null; }
    }
    clB.addEventListener("click", function () {
      if (!armed) {
        armed = true; clB.textContent = "Confirm?"; clB.classList.add("danger");
        armT = setTimeout(disarm, 2500);
        return;
      }
      disarm();
      doClear();
    });

    // ---- drawing ------------------------------------------
    var SM = 0.55;
    var drawing = false, smooth = null, lastPushed = null;

    function beginStroke(w) {
      drawing = true;
      if (tool === "pen") {
        smooth = { x: w.x, y: w.y };
        lastPushed = { x: w.x, y: w.y };
        live = {
          type: "stroke",
          color: st.erasing ? PAPER : st.color,
          size: st.erasing ? st.size * 2.4 : st.size,
          pts: [{ x: w.x, y: w.y }]
        };
      } else {
        live = {
          type: "shape",
          kind: tool,
          color: st.erasing ? PAPER : st.color,
          size: st.erasing ? st.size * 2.4 : st.size,
          a: { x: w.x, y: w.y },
          b: { x: w.x, y: w.y }
        };
      }
      render();
    }
    function extendStroke(w) {
      if (!drawing || !live) return;
      if (live.type === "stroke") {
        smooth.x += (w.x - smooth.x) * SM;
        smooth.y += (w.y - smooth.y) * SM;
        var dx = smooth.x - lastPushed.x, dy = smooth.y - lastPushed.y;
        if (dx * dx + dy * dy >= 0.6 / (view.scale * view.scale)) {
          live.pts.push({ x: smooth.x, y: smooth.y });
          lastPushed = { x: smooth.x, y: smooth.y };
        }
      } else {
        live.b = { x: w.x, y: w.y };
      }
      render();
    }
    function endStroke(keep) {
      if (!drawing) { live = null; return; }
      drawing = false;
      var el = live;
      live = null;
      if (!keep || !el) { render(); return; }
      if (el.type === "shape") {
        var moved = Math.abs(el.b.x - el.a.x) > 1.5 / view.scale || Math.abs(el.b.y - el.a.y) > 1.5 / view.scale;
        if (!moved) { render(); return; }
      }
      pushAdd(el);
    }
    function abortStroke() {
      drawing = false;
      live = null;
      render();
    }

    // flood-fill bucket: rasterise the current view, fill, keep it as a
    // world-anchored image element so it survives future pan / zoom
    function doFill(clientX, clientY) {
      try {
        var w = Math.max(1, Math.round(rect.width));
        var h = Math.max(1, Math.round(rect.height));
        var off = document.createElement("canvas");
        off.width = w; off.height = h;
        var o = off.getContext("2d", { willReadFrequently: true });
        o.fillStyle = PAPER; o.fillRect(0, 0, w, h);
        o.save();
        o.translate(view.x, view.y);
        o.scale(view.scale, view.scale);
        for (var i = 0; i < scene.length; i++) drawEl(o, scene[i]);
        o.restore();

        var sx = Math.round(clientX - rect.left), sy = Math.round(clientY - rect.top);
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;
        var src = o.getImageData(0, 0, w, h).data;
        var si = (sy * w + sx) * 4;
        var tr = src[si], tg = src[si + 1], tb = src[si + 2];
        var f = st.erasing ? hexRgb(PAPER) : hexRgb(st.color);
        if (Math.abs(tr - f[0]) + Math.abs(tg - f[1]) + Math.abs(tb - f[2]) < 10) return;

        var stamp = document.createElement("canvas");
        stamp.width = w; stamp.height = h;
        var scx = stamp.getContext("2d");
        var outImg = scx.createImageData(w, h), out = outImg.data;
        var seen = new Uint8Array(w * h);
        var stack = [sy * w + sx];
        var tol = 46;
        while (stack.length) {
          var p = stack.pop();
          if (seen[p]) continue;
          seen[p] = 1;
          var k = p * 4;
          if (Math.abs(src[k] - tr) + Math.abs(src[k + 1] - tg) + Math.abs(src[k + 2] - tb) > tol) continue;
          out[k] = f[0]; out[k + 1] = f[1]; out[k + 2] = f[2]; out[k + 3] = 255;
          var x = p % w, y = (p - x) / w;
          if (x + 1 < w) stack.push(p + 1);
          if (x - 1 >= 0) stack.push(p - 1);
          if (y + 1 < h) stack.push(p + w);
          if (y - 1 >= 0) stack.push(p - w);
        }
        scx.putImageData(outImg, 0, 0);
        var tl = toWorld(rect.left, rect.top);
        var br = toWorld(rect.left + rect.width, rect.top + rect.height);
        var el = { type: "image", src: stamp.toDataURL("image/png"), x: tl.x, y: tl.y, w: br.x - tl.x, h: br.y - tl.y };
        el.img = new Image();
        el.img.onload = render;
        el.img.src = el.src;
        pushAdd(el);
      } catch (e) { /* ignore fill failures */ }
    }

    // ---- pointers / gestures ----------------------------
    var ptrs = new Map();
    var pinch = null;
    var panStart = null;
    var pending = null;

    function midDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    stage.addEventListener("pointerdown", function (e) {
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
      rect = stage.getBoundingClientRect();
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (ptrs.size === 2) {
        pending = null;
        abortStroke();
        panStart = null;
        var a = Array.from(ptrs.values());
        pinch = { d: midDist(a[0], a[1]), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
        return;
      }
      if (ptrs.size !== 1) return;

      if (tool === "pan") {
        panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
        return;
      }
      if (tool === "fill") {
        doFill(e.clientX, e.clientY);
        return;
      }
      pending = { sx: e.clientX, sy: e.clientY, w: toWorld(e.clientX, e.clientY) };
    });

    stage.addEventListener("pointermove", function (e) {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pinch && ptrs.size >= 2) {
        var a = Array.from(ptrs.values());
        var nd = midDist(a[0], a[1]);
        var nmx = (a[0].x + a[1].x) / 2, nmy = (a[0].y + a[1].y) / 2;
        zoomAtPoint(nmx - rect.left, nmy - rect.top, nd / (pinch.d || nd));
        view.x += nmx - pinch.mx;
        view.y += nmy - pinch.my;
        pinch.d = nd; pinch.mx = nmx; pinch.my = nmy;
        applyRender();
        return;
      }
      if (panStart) {
        view.x = panStart.vx + (e.clientX - panStart.x);
        view.y = panStart.vy + (e.clientY - panStart.y);
        applyRender();
        return;
      }
      if (pending) {
        if (Math.hypot(e.clientX - pending.sx, e.clientY - pending.sy) > 4) {
          beginStroke(pending.w);
          pending = null;
          extendStroke(toWorld(e.clientX, e.clientY));
        }
        return;
      }
      if (drawing) extendStroke(toWorld(e.clientX, e.clientY));
    });

    function up(e) {
      ptrs.delete(e.pointerId);
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

      if (pinch && ptrs.size < 2) pinch = null;
      if (panStart && ptrs.size === 0) panStart = null;

      if (pending && ptrs.size === 0) {
        beginStroke(pending.w);   // a tap = a single dot
        endStroke(true);
        pending = null;
        return;
      }
      if (drawing && ptrs.size === 0) endStroke(e.type === "pointerup");
    }
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);

    stage.addEventListener("wheel", function (e) {
      e.preventDefault();
      if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        zoomAtPoint(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0016));
      } else {
        view.x -= e.deltaX;
        view.y -= e.deltaY;
      }
      applyRender();
    }, { passive: false });
    stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // ---- HUD -------------------------------------------
    document.getElementById("fitBtn").addEventListener("click", fitContent);

    var hudEls = Array.prototype.slice.call(document.querySelectorAll(".hud"));
    document.getElementById("hideBtn").addEventListener("click", function () {
      document.body.classList.add("ui-hidden");
      hudEls.forEach(function (h) { if (h.id !== "showUi") h.classList.add("gone"); });
    });
    document.getElementById("showUi").addEventListener("click", function () {
      document.body.classList.remove("ui-hidden");
      hudEls.forEach(function (h) { h.classList.remove("gone"); });
    });

    var exp = document.getElementById("exp"), expImg = document.getElementById("expImg");
    document.getElementById("doneBtn").addEventListener("click", function () {
      expImg.src = exportPNG();
      exp.classList.add("on");
    });
    document.getElementById("backBtn").addEventListener("click", function () {
      exp.classList.remove("on");
    });
  })();
  </script>
</body>
</html>
